<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login HRD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f6f9;">
    <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
        <i class="fas fa-building" style="font-size: 3rem; color: var(--primary-color); margin-bottom: 10px;"></i>
        <h2>LOGIN HRD</h2>
        <p class="mb-4">PT Mitra Sigma Tekindo</p>

        <form id="login-form">
            <div class="form-group text-left">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="form-group text-left position-relative">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" class="form-control" required style="padding-right: 40px;">
                    <i class="fas fa-eye" id="toggle-password-icon" style="position: absolute; right: 10px; top: 12px; cursor: pointer;"></i>
                </div>
            </div>
            <div id="login-error" class="alert alert-danger" style="display: none; margin-top: 10px;"></div>
            <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
        </form>

        <div class="mt-4">
            <a href="index.html" class="btn btn-link">Kembali ke Beranda</a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
