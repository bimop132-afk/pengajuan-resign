<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login HRD Admin - PT Mitra Sigma Tekindo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: linear-gradient(135deg, var(--primary-900) 0%, #242424 60%, var(--primary-700) 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

    <div class="card" style="width: 100%; max-width: 440px; padding: 2.75rem 2.25rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); border: 1px solid rgba(255, 255, 255, 0.1);">
        
        <div style="text-align: center; margin-bottom: 2rem;">
            <img src="assets/logo-mitra-sigma-tekindo-light.png" alt="Logo PT Mitra Sigma Tekindo" style="display: block; width: 235px; max-width: 100%; height: auto; margin: 0 auto 1.25rem;">
            <h2 style="font-size: 1.6rem; color: var(--gray-900); margin-bottom: 0.25rem;">PORTAL LOGIN HRD</h2>
            <p style="color: var(--gray-500); font-size: 0.9rem; margin: 0;">PT Mitra Sigma Tekindo</p>
        </div>

        <!-- Login Error Container -->
        <div id="login-error" style="display: none; background: var(--danger-50); border: 1px solid var(--danger-100); border-radius: var(--radius-sm); padding: 0.85rem 1rem; color: var(--danger-700); font-size: 0.88rem; margin-bottom: 1.5rem;">
            <i class="fas fa-exclamation-circle"></i> Username atau password salah.
        </div>

        <form id="login-form">
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label class="form-label" for="username">Username Admin</label>
                <div style="position: relative;">
                    <input type="text" id="username" class="form-control" placeholder="Masukkan username" required style="padding-left: 2.5rem;">
                    <i class="fas fa-user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--gray-400);"></i>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 1.75rem;">
                <label class="form-label" for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" class="form-control" placeholder="Masukkan password" required style="padding-left: 2.5rem; padding-right: 2.5rem;">
                    <i class="fas fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--gray-400);"></i>
                    <i id="toggle-password-icon" class="fas fa-eye" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); color: var(--gray-400); cursor: pointer;"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 1.5rem;">
                <i class="fas fa-sign-in-alt"></i> MASUK KE DASHBOARD
            </button>
        </form>

        <div style="text-align: center;">
            <a href="index.html" class="text-muted" style="font-size: 0.88rem; font-weight: 600;">
                <i class="fas fa-arrow-left"></i> Kembali ke Beranda Utama
            </a>
        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
