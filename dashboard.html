<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard HRD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px;">
        <div>
            <h2 style="margin: 0;">PT Mitra Sigma Tekindo</h2>
            <p style="margin: 0;">Dashboard HRD</p>
        </div>
        <button class="btn btn-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </header>

    <div class="container-fluid" style="padding: 20px;">
        <!-- Stats Row -->
        <div class="grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px;">
            <div class="card text-center" id="stat-total">
                <i class="fas fa-users" style="font-size: 2rem; color: #6c757d;"></i>
                <h3>0</h3><p>Total</p>
            </div>
            <div class="card text-center" id="stat-baru">
                <i class="fas fa-file-alt" style="font-size: 2rem; color: #007bff;"></i>
                <h3>0</h3><p>Baru</p>
            </div>
            <div class="card text-center" id="stat-diproses">
                <i class="fas fa-spinner" style="font-size: 2rem; color: #ffc107;"></i>
                <h3>0</h3><p>Diproses</p>
            </div>
            <div class="card text-center" id="stat-disetujui">
                <i class="fas fa-thumbs-up" style="font-size: 2rem; color: #28a745;"></i>
                <h3>0</h3><p>Disetujui</p>
            </div>
            <div class="card text-center" id="stat-ditolak">
                <i class="fas fa-times-circle" style="font-size: 2rem; color: #dc3545;"></i>
                <h3>0</h3><p>Ditolak</p>
            </div>
            <div class="card text-center" id="stat-selesai">
                <i class="fas fa-check-double" style="font-size: 2rem; color: #17a2b8;"></i>
                <h3>0</h3><p>Selesai</p>
            </div>
        </div>

        <!-- Filters -->
        <div class="card mb-4">
            <h4>Filter Data</h4>
            <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); align-items: end;">
                <div class="form-group">
                    <label>NIK</label>
                    <input type="text" id="filter-nik" class="form-control filter-input">
                </div>
                <div class="form-group">
                    <label>Nama</label>
                    <input type="text" id="filter-nama" class="form-control filter-input">
                </div>
                <div class="form-group">
                    <label>Departemen</label>
                    <select id="filter-departemen" class="form-control filter-input"><option value="">Semua</option></select>
                </div>
                <div class="form-group">
                    <label>Sektor</label>
                    <select id="filter-sektor" class="form-control filter-input"><option value="">Semua</option></select>
                </div>
                <div class="form-group">
                    <label>Regu</label>
                    <select id="filter-regu" class="form-control filter-input"><option value="">Semua</option></select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="filter-status" class="form-control filter-input">
                        <option value="">Semua Status</option>
                        <option value="PENGAJUAN BARU">PENGAJUAN BARU</option>
                        <option value="DIPERIKSA HRD">DIPERIKSA HRD</option>
                        <option value="DISETUJUI">DISETUJUI</option>
                        <option value="DITOLAK">DITOLAK</option>
                        <option value="SELESAI">SELESAI</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tgl Pengajuan Dari</label>
                    <input type="date" id="filter-tgl-dari" class="form-control filter-input">
                </div>
                <div class="form-group">
                    <label>Tgl Pengajuan Sampai</label>
                    <input type="date" id="filter-tgl-sampai" class="form-control filter-input">
                </div>
                <div class="form-group">
                    <label>Tgl Efektif Dari</label>
                    <input type="date" id="filter-tgl-efektif-dari" class="form-control filter-input">
                </div>
                <div class="form-group">
                    <label>Tgl Efektif Sampai</label>
                    <input type="date" id="filter-tgl-efektif-sampai" class="form-control filter-input">
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <button class="btn btn-primary" onclick="applyFilters()">Terapkan</button>
                    <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
                </div>
            </div>
        </div>

        <!-- Data Table -->
        <div class="card" style="overflow-x: auto;">
            <table class="table" style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #f4f6f9; text-align: left;">
                        <th>ID Pengajuan</th>
                        <th>NIK</th>
                        <th>Nama</th>
                        <th>Jabatan</th>
                        <th>Sektor</th>
                        <th>Regu</th>
                        <th>Tgl Pengajuan</th>
                        <th>Tgl Efektif</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Populated by JS -->
                </tbody>
            </table>
            <div id="pagination" class="mt-3 text-center"></div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <h3>Detail Pengajuan</h3>
            <div id="detail-content" style="margin-top: 15px;"></div>
            <div class="modal-actions mt-4 text-right">
                <button class="btn btn-secondary" onclick="closeDetailModal()">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Status Modal -->
    <div id="status-modal" class="modal">
        <div class="modal-content">
            <h3>Update Status Pengajuan</h3>
            <input type="hidden" id="status-id-pengajuan">
            <div class="form-group mt-3">
                <label>Status Baru</label>
                <select id="status-select" class="form-control">
                    <option value="PENGAJUAN BARU">PENGAJUAN BARU</option>
                    <option value="DIPERIKSA HRD">DIPERIKSA HRD</option>
                    <option value="DISETUJUI">DISETUJUI</option>
                    <option value="DITOLAK">DITOLAK</option>
                    <option value="SELESAI">SELESAI</option>
                </select>
            </div>
            <div class="form-group mt-3">
                <label>Catatan / Nomor Surat (jika disetujui)</label>
                <textarea id="status-catatan" class="form-control" rows="3"></textarea>
            </div>
            <div class="modal-actions mt-4 text-right" style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn btn-secondary" onclick="closeStatusModal()">Batal</button>
                <button class="btn btn-primary" onclick="updateStatus()">Simpan</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/surat.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
